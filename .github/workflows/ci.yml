name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            werror: "ON"
          - os: macos-latest
            werror: "OFF"
          - os: windows-latest
            werror: "OFF"
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DM6510_WARNINGS_AS_ERRORS=${{ matrix.werror }}
      - name: Build
        shell: bash
        run: cmake --build build --config Release > build.log 2>&1 || { cat build.log; python3 tools/ci_annotate.py "build failed" build.log; }
      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure > test.log 2>&1 || { cat test.log; python3 tools/ci_annotate.py "tests failed" test.log; }; cat test.log

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DM6510_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          M6510_ROUNDTRIP_STEP: "15"   # every 15th high byte of two-byte operands (the full run takes minutes under the sanitizers)
        run: ctest --test-dir build --output-on-failure

  crosscheck:
    name: Cross-check against cc65 (ca65, da65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DM6510_BUILD_TOOLS=ON -DM6510_BUILD_TESTS=OFF && cmake --build build
      - name: Assembler vs ca65
        shell: bash
        run: python3 tools/crosscheck_ca65.py build/m6510tool build/m6510_dump_forms > ca65.log 2>&1 || { cat ca65.log; python3 tools/ci_annotate.py "ca65 cross-check failed" ca65.log; }; cat ca65.log; echo "::notice title=ca65 cross-check::$(head -2 ca65.log | tr '\n' ' ')"
      - name: Decoder vs da65
        shell: bash
        run: python3 tools/crosscheck_da65.py build/m6510_dump_forms > da65.log 2>&1 || { cat da65.log; python3 tools/ci_annotate.py "da65 cross-check failed" da65.log; }; cat da65.log; echo "::notice title=da65 cross-check::$(head -2 da65.log | tr '\n' ' ')"

  c1541:
    name: Cross-check against c1541 (VICE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install VICE (c1541)
        run: sudo apt-get update && sudo apt-get install -y vice
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DM6510_BUILD_TESTS=OFF && cmake --build build
      - name: D64 reader vs c1541
        shell: bash
        run: python3 tools/crosscheck_c1541.py build/m6510tool c1541 > c1541.log 2>&1 || { cat c1541.log; python3 tools/ci_annotate.py "c1541 cross-check failed" c1541.log; }; cat c1541.log; echo "::notice title=c1541 cross-check::$(head -1 c1541.log)"

  singlestep:
    name: Tom Harte single-step tests (6502, 2.4 million cases)
    runs-on: ubuntu-latest
    env:
      HARTE_COMMIT: 2f6980a2d95757486c7bee24355c360e40e2a224   # SingleStepTests/65x02, MIT; fetched, not stored here
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DM6510_BUILD_TOOLS=ON -DM6510_BUILD_TESTS=OFF && cmake --build build
      - name: Cache test set
        id: cache
        uses: actions/cache@v4
        with:
          path: harte
          key: harte-6502-v1-${{ env.HARTE_COMMIT }}
      - name: Fetch test set (about 1 GB)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p harte
          for i in $(seq 0 255); do printf '%02x\n' $i; done | xargs -P 16 -I{} curl -sSfL --retry 3 -o harte/{}.json \
            https://raw.githubusercontent.com/SingleStepTests/65x02/$HARTE_COMMIT/6502/v1/{}.json
      - name: Run
        shell: bash
        run: |
          ./build/m6510_harte harte/*.json > harte.log 2>&1 || { grep -v ": 10000 tests, 0 failed" harte.log; python3 tools/ci_annotate.py "single-step tests failed" harte.log; }
          tail -n 1 harte.log; echo "::notice title=single-step tests::$(tail -n 1 harte.log)"

  functional:
    name: Klaus Dormann functional test
    runs-on: ubuntu-latest
    env:
      DORMANN_COMMIT: 7954e2dbb49c469ea286070bf46cdd71aeb29e4b   # Klaus2m5/6502_65C02_functional_tests, GPL-3.0; fetched, not stored here
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DM6510_BUILD_TOOLS=ON -DM6510_BUILD_TESTS=OFF && cmake --build build
      - name: Fetch test image
        run: curl -sSfLO https://raw.githubusercontent.com/Klaus2m5/6502_65C02_functional_tests/$DORMANN_COMMIT/bin_files/6502_functional_test.bin
      - name: Run (success trap at $3469)
        shell: bash
        run: |
          ./build/m6510_dormann 6502_functional_test.bin 0 0x400 0x3469 > dormann.log 2>&1 || { cat dormann.log; python3 tools/ci_annotate.py "functional test failed" dormann.log; }
          cat dormann.log; echo "::notice title=functional test::$(cat dormann.log)"
